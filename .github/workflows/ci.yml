name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install flex & bison (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y flex bison
      - name: Build
        run: make -C compiler
      - name: Test
        run: ./run_all_tests.sh
      - name: Lint healer
        run: python3 -m py_compile healer/healer.py
